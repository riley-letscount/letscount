<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>おねえさんのコンピュータ</title>
    <style>
      :root {
        --page-bg: #d9d9d9;
        --frame-border: #4a4340;
        --frame-bg: #cfcfcf;
        --ink: #111111;
        --ink-soft: #3d3d3d;
        --grid-line: #1c1c1c;
        --marker-bg: #0d0d0d;
        --marker-ink: #ffffff;
        --path: #d8402f;
        --processed: #2456a6;
        --frontier: #dd9414;
        --btn-bg: #ffffff;
        --btn-ink: #16181d;
        --btn-line: #9a9a9a;
        --btn-active-bg: #16181d;
        --btn-active-ink: #ffffff;
        --primary-bg: #16181d;
        --primary-ink: #ffffff;
        --teach-bg: #b3541e;
        --teach-ink: #ffffff;
        --link: #1a46c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #17181c;
          --frame-border: #8f8a86;
          --frame-bg: #232529;
          --ink: #f2f2f0;
          --ink-soft: #c6c9cd;
          --grid-line: #d7d7d7;
          --marker-bg: #f2f2f0;
          --marker-ink: #111111;
          --path: #ff7a5c;
          --processed: #7aa5e8;
          --frontier: #f2b04e;
          --btn-bg: #2b2e34;
          --btn-ink: #f2f2f0;
          --btn-line: #5a5e66;
          --btn-active-bg: #f2f2f0;
          --btn-active-ink: #16181d;
          --primary-bg: #f2f2f0;
          --primary-ink: #16181d;
          --teach-bg: #c96a2e;
          --teach-ink: #ffffff;
          --link: #8fb0ff;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--page-bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .num { font-variant-numeric: tabular-nums; }
      main {
        max-width: 430px;
        margin: 0 auto;
        padding: 8px 10px 12px;
      }

      /* ---------- 大きな枠 ---------- */
      .frame {
        border: 12px solid var(--frame-border);
        border-radius: 18px;
        background: var(--frame-bg);
        padding: 14px 16px 14px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        line-height: 1.35;
        text-align: center;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .subtitle {
        margin: 6px 0 0;
        text-align: center;
        font-size: 7.5px;
        font-weight: 700;
        color: var(--ink-soft);
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .stage {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 10px;
      }
      .stage-left {
        flex: 1 1 0;
        min-width: 0;
        padding-top: 16px;
        text-align: center;
      }
      .size-big {
        font-size: 30px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .status {
        margin-top: 14px;
        font-size: 14px;
        font-weight: 700;
        min-height: 1.4em;
      }
      .elapsed {
        margin-top: 4px;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-soft);
      }
      .elapsed .num { font-size: 19px; color: var(--ink); }
      .board-wrap {
        flex: 0 0 47%;
        position: relative;
      }
      canvas#board {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
      }
      .result {
        margin-top: 14px;
      }
      .count-jp {
        font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
        font-weight: 700;
        font-size: 19px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        min-height: 1.45em;
      }
      .count-jp .suffix { font-size: 19px; }
      .patterns {
        text-align: right;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-soft);
        margin-top: 2px;
      }
      .count-exact {
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--ink-soft);
        overflow-wrap: anywhere;
        line-height: 1.5;
        min-height: 1.5em;
      }

      /* ---------- 操作系 ---------- */
      .controls { margin-top: 10px; }
      .size-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .size-btn {
        min-height: 46px;
        padding: 6px 2px;
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        color: var(--btn-ink);
        background: var(--btn-bg);
        border: 1.5px solid var(--btn-line);
        border-radius: 10px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .size-btn[aria-pressed="true"] {
        background: var(--btn-active-bg);
        color: var(--btn-active-ink);
        border-color: var(--btn-active-bg);
      }
      .size-btn:disabled { opacity: 0.45; cursor: default; }
      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        margin-top: 8px;
      }
      .act-btn {
        min-height: 52px;
        padding: 8px 6px;
        font: inherit;
        font-size: 18px;
        font-weight: 900;
        border-radius: 10px;
        border: 1.5px solid transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .act-btn:disabled { opacity: 0.45; cursor: default; }
      #stopBtn {
        background: var(--btn-bg);
        color: var(--btn-ink);
        border-color: var(--btn-line);
      }
      .teach-check {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 8px 12px;
        background: var(--teach-bg);
        color: var(--teach-ink);
        border-radius: 10px;
        font-size: 17px;
        font-weight: 900;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .teach-check input[type="checkbox"] {
        width: 26px;
        height: 26px;
        margin: 0;
        flex: 0 0 auto;
        accent-color: var(--primary-bg);
        cursor: pointer;
      }
      .teach-check:has(input:disabled) { opacity: 0.45; cursor: default; }
      .teach-check:has(input:disabled) input[type="checkbox"] { cursor: default; }
      button:focus-visible { outline: 2.5px solid var(--processed); outline-offset: 2px; }

      .origin {
        margin-top: 12px;
        font-size: 13.5px;
        line-height: 1.55;
      }
      .origin a { color: var(--link); }
      .standard-link {
        margin: 14px 0 2px;
        font-size: 16px;
        line-height: 1.5;
        font-weight: 700;
        text-align: center;
      }
      .standard-link a { color: var(--link); }
    </style>
  </head>
  <body>
    <main>
      <section class="frame" aria-label="数え上げ">
        <h1>同じ所を2度通らない道順の数</h1>
        <p class="subtitle">Total number of routes that do not pass by the same place twice</p>

        <div class="stage">
          <div class="stage-left">
            <div class="size-big num" id="sizeBig">—</div>
            <div class="status" id="statusText"></div>
            <div class="elapsed">時間 <span class="num" id="resTime">—</span></div>
          </div>
          <div class="board-wrap">
            <canvas id="board" aria-label="マス目のグリッド"></canvas>
          </div>
        </div>

        <div class="result">
          <div class="count-jp" id="resCount">—</div>
          <div class="patterns">patterns</div>
          <div class="count-exact num" id="resDigits"></div>
        </div>
      </section>

      <p class="standard-link"><a href="https://riley-letscount.github.io/letscount/" target="_blank" rel="noopener">通常版はこちら</a></p>

      <section class="controls" aria-label="操作">
        <div class="size-grid" id="sizeGrid" role="group" aria-label="マス目の大きさ"></div>
        <div class="actions">
          <button type="button" class="act-btn" id="stopBtn" disabled>stop</button>
          <label class="teach-check"><input type="checkbox" id="teachCheck" />おねえさんに教えてあげる</label>
        </div>
      </section>

      <p class="origin">元ネタ <a href="https://www.youtube.com/watch?v=Q4gTV4r0zRs" target="_blank" rel="noopener">『フカシギの数え方』おねえさんといっしょ！みんなで数えてみよう！</a></p>
    </main>

    <script>
      "use strict";
      /* ============================================================
         シングル用 Worker 本体（Blob から生成する。単体で完結させること）
         - brute:       素朴な深さ優先探索（反復版）
         - simpathPack: パック方式。frontier 法レイヤDPを、プラグ符号を
           1セル2bitに詰めた単一数値キーだけで実行する（16×16以下）
         - simpathPackWide: 17×17以上用。同じ詰め方のままキーだけを
           BigInt にした広いキー経路（"fastpackwide" で強制使用も可能）
         対称性で「最初の一手は右固定×2」は全方式共通。
         ============================================================ */
      function oneesanWorker() {
function simpathPack(n, onProgress) {
          var W = n + 1, V = W * W, S = 0, T = V - 1;
          var edges = [], r, c, i, v;
          for (r = 0; r < W; r++) for (c = 0; c < W; c++) {
            var id = r * W + c;
            if (c < n) edges.push([id, id + 1]);
            if (r < n) edges.push([id, id + W]);
          }
          var E = edges.length;
          var lastIdx = new Array(V).fill(-1), firstIdx = new Array(V).fill(1073741824);
          edges.forEach(function (e, i2) {
            for (var k = 0; k < 2; k++) {
              var x = e[k];
              if (i2 > lastIdx[x]) lastIdx[x] = i2;
              if (i2 < firstIdx[x]) firstIdx[x] = i2;
            }
          });
          var frontiers = [], posInF = [];
          for (i = 0; i <= E; i++) {
            var f = [];
            for (v = 0; v < V; v++) if (firstIdx[v] < i && lastIdx[v] >= i) f.push(v);
            frontiers.push(f);
            var pos = new Array(V).fill(-1);
            f.forEach(function (vv, ii) { pos[vv] = ii; });
            posInF.push(pos);
          }
          var POW4 = [], POW2 = [], k;
          for (k = 0; k <= 20; k++) { POW4.push(Math.pow(4, k)); POW2.push(Math.pow(2, k)); }
          var totalStates = 0, maxStates = 1;
          var t0 = Date.now(), lastPost = 0;
          function report(idx, states) {
            if (!onProgress) return;
            var now = Date.now();
            if (now - lastPost >= 250 || idx === E) {
              lastPost = now;
              onProgress({ idx: idx, E: E, states: states, totalStates: totalStates, maxStates: maxStates, elapsed: now - t0, lowMem: false });
            }
          }
          // スクラッチ（状態ごとに確保せず使い回す）
          var codes = new Int8Array(20), degs = new Int8Array(20), matePos = new Int16Array(20), mateVid = new Int32Array(20);
          var stack = new Int16Array(20);
          var PACK_RESOLVED = new Int8Array(20);
          var dp = new Map();
          dp.set(0, 1n);
          for (i = 0; i < E; i++) {
            var u = edges[i][0], w = edges[i][1];
            var Fi = frontiers[i], Fi1 = frontiers[i + 1], posi = posInF[i], posi1 = posInF[i + 1];
            var L = Fi.length, L1 = Fi1.length;
            var pow4L = POW4[L], pow4L1 = POW4[L1];
            var pu = posi[u], pw = posi[w];
            var isSRight = (u === S && w === S + 1), isSDown = (u === S && w === S + W);
            var uLast = lastIdx[u] === i, wLast = lastIdx[w] === i;
            var pT = posi[T]; // 現 frontier における終点セルの位置（なければ -1）
            var ndp = new Map();
            var iterFn = function (cnt, key) {
              // --- キーをスクラッチへ展開（プラグ符号と次数） ---
              var plugPart = key % pow4L, degPart = Math.floor(key / pow4L);
              var q;
              if (L <= 15) {
                var pi = plugPart | 0;
                for (q = 0; q < L; q++) {
                  var cd = (pi >>> (2 * q)) & 3;
                  codes[q] = cd;
                  degs[q] = cd !== 0 ? 1 : (((degPart >> q) & 1) ? 2 : 0);
                }
              } else {
                var tmp = plugPart;
                for (q = 0; q < L; q++) { var cd2 = tmp % 4; codes[q] = cd2; tmp = (tmp - cd2) / 4; }
                for (q = 0; q < L; q++) {
                  if (codes[q] !== 0) degs[q] = 1;
                  else degs[q] = ((degPart >> q) & 1) ? 2 : 0;
                }
              }
              // --- 各次数1セルの相手頂点を求める ---
              // 括弧同士の対応は非交差。始点セル（あれば先頭位置）の相手は始点側プラグ X、
              // 終点セル（あれば末尾位置）の相手は終点側プラグ X で、どちらも括弧ではなく X で
              // 表されるため、まず始点・終点セルの相手を深さ走査で特定し、残りの括弧を
              // スタックで対応付ける。始点側プラグは終点側プラグより常に左にある（実測でも全状態で成立）。
              var pS = posi[S];
              for (q = 0; q < L; q++) { mateVid[q] = -1; matePos[q] = -1; }
              var resolved = PACK_RESOLVED; // Int8Array(20) を使い回す
              for (q = 0; q < L; q++) resolved[q] = 0;
              // 始点セル → 始点側プラグ
              if (pS >= 0 && degs[pS] === 1) {
                if (codes[pS] === 3) { mateVid[pS] = T; resolved[pS] = 1; }
                else {
                  var depth = 0, j;
                  for (j = pS + 1; j < L; j++) {
                    if (degs[j] !== 1) continue;
                    if (codes[j] === 1) depth++;
                    else if (codes[j] === 2) { if (depth > 0) depth--; }
                    else if (codes[j] === 3 && depth === 0) {
                      mateVid[pS] = Fi[j]; mateVid[j] = S; resolved[pS] = 1; resolved[j] = 1; break;
                    }
                  }
                }
              }
              // 終点セル → 終点側プラグ（または完成マーカー）
              if (pT >= 0 && degs[pT] === 1) {
                if (codes[pT] === 3) { mateVid[pT] = S; resolved[pT] = 1; }
                else {
                  var depth2 = 0, j2;
                  for (j2 = pT - 1; j2 >= 0; j2--) {
                    if (degs[j2] !== 1 || resolved[j2]) continue;
                    if (codes[j2] === 2) depth2++;
                    else if (codes[j2] === 1) { if (depth2 > 0) depth2--; }
                    else if (codes[j2] === 3 && depth2 === 0) {
                      mateVid[pT] = Fi[j2]; mateVid[j2] = T; resolved[pT] = 1; resolved[j2] = 1; break;
                    }
                  }
                }
              }
              // 残り: X は始点側プラグ（始点セルが既に境界外）、括弧はスタックで対応付け
              var sp = 0;
              for (q = 0; q < L; q++) {
                if (degs[q] !== 1 || resolved[q]) continue;
                if (codes[q] === 3) { mateVid[q] = S; resolved[q] = 1; }
                else if (codes[q] === 1) stack[sp++] = q;
                else if (codes[q] === 2) {
                  var op = stack[--sp];
                  matePos[op] = q; matePos[q] = op;
                  mateVid[op] = Fi[q]; mateVid[q] = Fi[op];
                  resolved[op] = 1; resolved[q] = 1;
                }
              }
              var du = pu >= 0 ? degs[pu] : 0, dw = pw >= 0 ? degs[pw] : 0;
              var auVid = du === 1 ? mateVid[pu] : -1, avVid = dw === 1 ? mateVid[pw] : -1;
              for (var branch = 0; branch < 2; branch++) {
                var include = branch === 1;
                if (isSRight && !include) continue;
                if (isSDown && include) continue;
                var ndu = du, ndw = dw;
                var mateU = du === 1 ? auVid : w, mateW = dw === 1 ? avVid : u, mateAu = u, mateAv = w;
                if (include) {
                  if (du >= 2 || dw >= 2) continue;
                  if ((u === S || u === T) && du >= 1) continue;
                  if ((w === S || w === T) && dw >= 1) continue;
                  if (du === 1 && dw === 1) {
                    if (auVid === w) continue; // 同じ部分経路の両端 → 閉路
                    ndu = 2; ndw = 2; mateAu = avVid; mateAv = auVid;
                  } else if (du === 1) {
                    ndu = 2; ndw = 1; mateW = auVid; mateAu = w;
                  } else if (dw === 1) {
                    ndw = 2; ndu = 1; mateU = avVid; mateAv = u;
                  } else {
                    ndu = 1; ndw = 1; mateU = w; mateW = u;
                  }
                }
                if (uLast) { if (u === S || u === T) { if (ndu !== 1) continue; } else if (ndu === 1) continue; }
                if (wLast) { if (w === S || w === T) { if (ndw !== 1) continue; } else if (ndw === 1) continue; }
                // --- 次レイヤのキーへ詰め直す ---
                var newPlug = 0, newDeg = 0, bad = false;
                for (var q1 = 0; q1 < L1; q1++) {
                  var x = Fi1[q1], d, mvv;
                  if (x === u) { d = ndu; mvv = mateU; }
                  else if (x === w) { d = ndw; mvv = mateW; }
                  else if (x === auVid) { d = 1; mvv = mateAu; }
                  else if (x === avVid) { d = 1; mvv = mateAv; }
                  else {
                    var p = posi[x];
                    d = degs[p];
                    mvv = d === 1 ? mateVid[p] : -1;
                  }
                  if (d === 2) { newDeg += POW2[q1]; }
                  else if (d === 1) {
                    var code;
                    if (mvv === S && x !== S) code = 3;
                    else if (mvv === T && x !== T) code = 3;
                    else {
                      var np = posi1[mvv];
                      if (np === -1) { bad = true; break; }
                      code = np > q1 ? 1 : 2;
                    }
                    newPlug += code * POW4[q1];
                  }
                }
                if (bad) continue;
                var nkey = newPlug + newDeg * pow4L1;
                var ex = ndp.get(nkey);
                if (ex !== undefined) ndp.set(nkey, ex + cnt);
                else ndp.set(nkey, cnt);
              }
            };
            dp.forEach(iterFn);
            dp = ndp;
            totalStates += dp.size;
            if (dp.size > maxStates) maxStates = dp.size;
            if (dp.size === 0) break;
            report(i + 1, dp.size);
          }
          var rawTotal = 0n;
          dp.forEach(function (c) { rawTotal += c; });
          var total = rawTotal * 2n;
          return { total: total, totalStates: totalStates, maxStates: maxStates, E: E, elapsed: Date.now() - t0, lowMem: false };
        }

        // ===== パック方式・広いキー経路（17×17以上） =====
        // simpathPack と同一の詰め方・遷移規則のまま、状態キーだけを BigInt にした経路。
        // キーが安全整数に収まる 16×16以下では使わない（従来の Number キー経路が従来どおり動く）。
function simpathPackWide(n, onProgress) {
          var W = n + 1, V = W * W, S = 0, T = V - 1;
          var edges = [], r, c, i, v;
          for (r = 0; r < W; r++) for (c = 0; c < W; c++) {
            var id = r * W + c;
            if (c < n) edges.push([id, id + 1]);
            if (r < n) edges.push([id, id + W]);
          }
          var E = edges.length;
          var lastIdx = new Array(V).fill(-1), firstIdx = new Array(V).fill(1073741824);
          edges.forEach(function (e, i2) {
            for (var k = 0; k < 2; k++) {
              var x = e[k];
              if (i2 > lastIdx[x]) lastIdx[x] = i2;
              if (i2 < firstIdx[x]) firstIdx[x] = i2;
            }
          });
          var frontiers = [], posInF = [];
          for (i = 0; i <= E; i++) {
            var f = [];
            for (v = 0; v < V; v++) if (firstIdx[v] < i && lastIdx[v] >= i) f.push(v);
            frontiers.push(f);
            var pos = new Array(V).fill(-1);
            f.forEach(function (vv, ii) { pos[vv] = ii; });
            posInF.push(pos);
          }
          var POW4 = [], POW2 = [], k;
          for (k = 0; k <= 32; k++) { POW4.push(Math.pow(4, k)); POW2.push(Math.pow(2, k)); }
          var totalStates = 0, maxStates = 1;
          var t0 = Date.now(), lastPost = 0;
          function report(idx, states) {
            if (!onProgress) return;
            var now = Date.now();
            if (now - lastPost >= 250 || idx === E) {
              lastPost = now;
              onProgress({ idx: idx, E: E, states: states, totalStates: totalStates, maxStates: maxStates, elapsed: now - t0, lowMem: false });
            }
          }
          // スクラッチ（状態ごとに確保せず使い回す）
          var codes = new Int8Array(32), degs = new Int8Array(32), matePos = new Int16Array(32), mateVid = new Int32Array(32);
          var stack = new Int16Array(32);
          var PACK_RESOLVED = new Int8Array(32);
          var dp = new Map();
          dp.set(0n, 1n);
          for (i = 0; i < E; i++) {
            var u = edges[i][0], w = edges[i][1];
            var Fi = frontiers[i], Fi1 = frontiers[i + 1], posi = posInF[i], posi1 = posInF[i + 1];
            var L = Fi.length, L1 = Fi1.length;
            var pow4L = POW4[L], pow4L1 = POW4[L1];
            var pow4LB = BigInt(pow4L), pow4L1B = BigInt(pow4L1);
            var pu = posi[u], pw = posi[w];
            var isSRight = (u === S && w === S + 1), isSDown = (u === S && w === S + W);
            var uLast = lastIdx[u] === i, wLast = lastIdx[w] === i;
            var pT = posi[T]; // 現 frontier における終点セルの位置（なければ -1）

resTime.textContent = fmtMs(Date.now() - runStart);
}, 200);
}
function startRun(fast) {
if (running) return;
runMode = fast ? "fastpack" : "brute";
beginRunUI(fast);
viewPath = fast ? null : [0, 1];
draw();
worker = new Worker(getWorkerUrl());
worker.onmessage = onWorkerMessage;
worker.onerror = function () {
if (!running) return;
finishRun();
statusText.textContent = "エラーで停止しました";
resCount.textContent = "—";
};
worker.postMessage({ type: runMode, n: runSize });
}
function onWorkerMessage(ev) {
var m = ev.data;
if (!m || !running) return;
if (m.type === "progress") {
lastProgress = m;
if (m.mode === "brute") {
viewPath = m.path;
setCountJP((BigInt(m.count) * 2n).toString());
resDigits.textContent = "（数え上げ途中）";
} else {
viewFrontierIdx = m.idx;
}
draw();
return;
}
if (m.type === "done") {
results[m.mode][m.n] = { count: m.count, ms: m.elapsed };
var doneSize = m.n;
finishRun();
statusText.textContent = "完了";
viewFrontierIdx = -1;
showStored(m.mode === "fastpack" ? "fastpack" : "brute");
viewPath = findOnePath(doneSize);
draw();
return;
}
if (m.type === "error") {
finishRun();
statusText.textContent = "エラーで停止しました";
resCount.textContent = "—";
}
}
function stopRun() {
if (!running) return;
var wasMode = runMode, lp = lastProgress;
finishRun();
statusText.textContent = "停止しました";
viewFrontierIdx = -1;
if (wasMode === "brute" && lp) {
setCountJP((BigInt(lp.count) * 2n).toString());
resDigits.textContent = "（停止時点・未確定）";
viewPath = lp.path || null;
} else {
resCount.textContent = "—";
resDigits.textContent = "";
viewPath = null;
}
draw();
}

stopBtn.addEventListener("click", stopRun);

/* ---------- 初期化 ---------- */
if (window.ResizeObserver) {
new ResizeObserver(function () { fitCanvas(); }).observe(board);
}
window.addEventListener("resize", fitCanvas);
if (darkQuery.addEventListener) darkQuery.addEventListener("change", draw);
refreshSizeUI();
fitCanvas();
draw();
    </script>
  </body>
</html>
